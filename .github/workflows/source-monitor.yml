name: Official Source Monitor

# Read-only monitor: fetches each official exam source and records HTTP status +
# SHA-256 of the body into ops/source-registry/source-hashes.json. No secrets,
# public URLs only. Commits the snapshot back only when it changes. Scheduled
# execution remains paused until the next version submission is explicitly started.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certbom-source-writers
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Run source monitor
        run: node scripts/monitor-sources.mjs && node scripts/generate-source-metadata.mjs

      - name: Commit updated source-hashes.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain ops/source-registry/source-hashes.json packages/core/src/source-metadata.generated.ts)" ]; then
            git add ops/source-registry/source-hashes.json packages/core/src/source-metadata.generated.ts
            git commit -m "chore: update official-source content hashes"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No source-hashes.json changes to commit."
          fi
